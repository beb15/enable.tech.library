<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ENABLE Design System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,300..900;1,400..700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>/* Layout: MUI-style docs shell — sticky app bar, grouped left nav, content column with live demo frames, right-hand "On this page" rail. */
:root{
  /* Brand — sampled from enable.tech */
  --navy:#050A30; --navy-900:#08082E; --navy-800:#213142; --cyan:#00B3EB; --cyan-700:#00769C; --cyan-50:#E6F7FD;
  --logo-blue:#204496; --logo-mid:#1C60A3; --logo-cyan:#00EAE9;
  --rewards:#5E17EB; --engage:#35B870; --fulfill:#00B3EB; --coral:#EF5F4E; --stat-blue:#5088F5; --whatsapp:#4FC26B;
  /* Slate neutrals (enable.tech) */
  --slate-0:#FFFFFF; --slate-25:#F8FAFC; --slate-50:#F1F5F9; --slate-100:#E9EEF5; --slate-200:#E2E8F0;
  --slate-300:#CBD5E1; --slate-400:#94A3B8; --slate-500:#64748B; --slate-600:#52526D; --slate-700:#334155; --slate-900:#0F172A;
  /* Tiers */
  --tier-silver:#A7ADB8; --tier-gold:#C9A24A; --tier-gold-50:#F8F0DC; --tier-black:#1A1A1C;
  /* Tenant theme (loyalty pages only) — default: Dimitri's Coffee */
  --tenant:#E5322B; --tenant-hover:#D42C25; --tenant-soft:#FCEAE9; --tenant-text:#D42C25; --on-tenant:#FFFFFF;

  /* Roles (light) */
  --bg:#F8FAFC; --surface:#FFFFFF; --surface-2:#F1F5F9; --surface-3:#E9EEF5;
  --fg:#050A30; --fg-2:#334155; --fg-3:#64748B; --placeholder:#94A3B8;
  --border:#E2E8F0; --border-strong:#CBD5E1;
  --primary:#050A30; --primary-hover:#141B4D; --primary-press:#000000; --on-primary:#FFFFFF;
  --accent:#00B3EB; --accent-text:#00769C; --accent-soft:#E6F7FD; --on-accent:#050A30;
  --primary-soft:#E6F7FD; --primary-text:#00769C;
  --inverse:#050A30; --on-inverse:#FFFFFF;
  --focus:#00B3EB; --code-bg:#F1F5F9;
  --rewards-text:#5E17EB; --engage-text:#047857; --fulfill-text:#00769C;
  --success:#047857; --success-50:#D1FAE5; --warning:#B45309; --warning-50:#FEF3C7; --info:#2F64D8; --info-50:#E8EFFE; --danger:#D63F2E; --danger-50:#FDECEA;
  --shadow-1:0 1px 2px rgba(5,10,48,.06),0 1px 1px rgba(5,10,48,.04);
  --shadow-2:0 4px 12px rgba(5,10,48,.08),0 1px 3px rgba(5,10,48,.06);
  --shadow-3:0 16px 40px rgba(5,10,48,.16),0 4px 12px rgba(5,10,48,.08);
  --scrim:rgba(5,10,48,.5);

  --font:"Exo 2","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-ar:"IBM Plex Sans Arabic","Exo 2",system-ui,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;

  --r-xs:6px; --r-sm:8px; --r-md:10px; --r-lg:14px; --r-xl:20px; --r-2xl:28px; --r-pill:999px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s10:40px; --s12:48px; --s16:64px;
  --ease:cubic-bezier(.2,.7,.2,1); --dur-1:120ms; --dur-2:200ms; --dur-3:320ms;
  --topbar:60px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#06082A; --surface:#0E1238; --surface-2:#131845; --surface-3:#1B2152;
  --fg:#F1F5F9; --fg-2:#CBD5E1; --fg-3:#9AA3C7; --placeholder:#7C86B0;
  --border:#232A5C; --border-strong:#323B73;
  --primary:#00B3EB; --primary-hover:#38CCFA; --primary-press:#0097C7; --on-primary:#050A30;
  --accent:#00B3EB; --accent-text:#38CCFA; --accent-soft:#0B2E52; --on-accent:#050A30;
  --primary-soft:#0B2E52; --primary-text:#38CCFA;
  --inverse:#FFFFFF; --on-inverse:#050A30;
  --focus:#38CCFA; --code-bg:#1B2152;
  --rewards-text:#A78BFA; --engage-text:#4ADE80; --fulfill-text:#38CCFA;
  --success:#4ADE80; --success-50:#0D3330; --warning:#FBBF24; --warning-50:#33290F; --info:#8EB2FF; --info-50:#16245A; --danger:#FF8A7A; --danger-50:#3A1A2E;
  --tier-gold-50:#2E2817;
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 6px 16px rgba(0,0,0,.45); --shadow-3:0 20px 48px rgba(0,0,0,.6);
  --scrim:rgba(2,4,18,.72);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#06082A; --surface:#0E1238; --surface-2:#131845; --surface-3:#1B2152;
  --fg:#F1F5F9; --fg-2:#CBD5E1; --fg-3:#9AA3C7; --placeholder:#7C86B0;
  --border:#232A5C; --border-strong:#323B73;
  --primary:#00B3EB; --primary-hover:#38CCFA; --primary-press:#0097C7; --on-primary:#050A30;
  --accent:#00B3EB; --accent-text:#38CCFA; --accent-soft:#0B2E52; --on-accent:#050A30;
  --primary-soft:#0B2E52; --primary-text:#38CCFA;
  --inverse:#FFFFFF; --on-inverse:#050A30;
  --focus:#38CCFA; --code-bg:#1B2152;
  --rewards-text:#A78BFA; --engage-text:#4ADE80; --fulfill-text:#38CCFA;
  --success:#4ADE80; --success-50:#0D3330; --warning:#FBBF24; --warning-50:#33290F; --info:#8EB2FF; --info-50:#16245A; --danger:#FF8A7A; --danger-50:#3A1A2E;
  --tier-gold-50:#2E2817;
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 6px 16px rgba(0,0,0,.45); --shadow-3:0 20px 48px rgba(0,0,0,.6);
  --scrim:rgba(2,4,18,.72);
  color-scheme:dark;
}
/* Tenant presets for loyalty demos */
[data-tenant="teal"]{--tenant:#0F8B8D; --tenant-hover:#0B7476; --tenant-soft:#E0F3F3; --tenant-text:#0B7476; --on-tenant:#FFFFFF}
[data-tenant="plum"]{--tenant:#7A2E8E; --tenant-hover:#652577; --tenant-soft:#F3E8F6; --tenant-text:#6A2780; --on-tenant:#FFFFFF}
[data-tenant="enable"]{--tenant:#050A30; --tenant-hover:#141B4D; --tenant-soft:#E6F7FD; --tenant-text:#00769C; --on-tenant:#FFFFFF}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{text-wrap:balance;margin:0;font-weight:700;letter-spacing:-.01em}
p{margin:0}
a{color:var(--primary-text)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--mono);font-size:.86em}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:16px;height:16px}.ico.lg{width:24px;height:24px}

/* ---------- Shell ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;height:var(--topbar);display:flex;align-items:center;gap:var(--s3);padding:0 var(--s4);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
@supports not (background:color-mix(in srgb,red,blue)){.topbar{background:var(--bg)}}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);min-width:0}
.brand img{width:26px;height:24px}
:root[data-theme="dark"] .brand img,:root[data-theme="dark"] .mark-img{filter:invert(1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand img,:root:not([data-theme="light"]) .mark-img{filter:invert(1)}}
.brand b{font-weight:800;font-size:17px;letter-spacing:.01em;white-space:nowrap}
.brand b{color:var(--logo-blue)}
.brand b i{font-style:normal;color:var(--logo-mid)}
:root[data-theme="dark"] .brand b,:root[data-theme="dark"] .brand b i{color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand b,:root:not([data-theme="light"]) .brand b i{color:#fff}}
.brand .ds{font-size:12px;font-weight:600;color:var(--fg-3);border:1px solid var(--border);border-radius:var(--r-pill);padding:2px 8px;white-space:nowrap}
.topbar .spacer{flex:1}
.search{position:relative;width:min(320px,40vw)}
.search input{width:100%;height:38px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface);padding:0 12px 0 36px;font-size:14px}
.search input::placeholder{color:var(--placeholder)}
.search .ico{position:absolute;left:10px;top:9px;color:var(--fg-3)}
.search kbd{position:absolute;right:8px;top:8px;font:600 11px var(--mono);color:var(--fg-3);border:1px solid var(--border);border-radius:5px;padding:1px 5px;background:var(--surface-2)}
.tb-btn{height:38px;min-width:38px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface);color:var(--fg-2);cursor:pointer;padding:0 10px;font-size:13px;font-weight:600}
.tb-btn:hover{background:var(--surface-2);color:var(--fg)}
.tb-btn[aria-pressed="true"]{background:var(--inverse);color:var(--on-inverse);border-color:var(--inverse)}
.menu-btn{display:none}

.shell{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:calc(100vh - var(--topbar))}
.sidenav{position:sticky;top:calc(var(--topbar) + env(safe-area-inset-top,0px));height:calc(100vh - var(--topbar));overflow-y:auto;border-right:1px solid var(--border);padding:var(--s4) var(--s3) var(--s12);background:var(--bg)}
.nav-group{margin-bottom:var(--s4)}
.nav-group > button{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;width:100%;padding:6px 10px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3);cursor:pointer;border-radius:var(--r-sm)}
.nav-group > button:focus-visible{outline:2px solid var(--focus)}
.nav-group > button .ico{transition:transform var(--dur-2) var(--ease)}
.nav-group[data-collapsed] > button .ico{transform:rotate(-90deg)}
.nav-group[data-collapsed] ul{display:none}
.nav-group ul{list-style:none;margin:2px 0 0;padding:0}
.nav-group a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;border-radius:var(--r-sm);color:var(--fg-2);text-decoration:none;font-size:14px;font-weight:500}
.nav-group a:hover{background:var(--surface-3);color:var(--fg)}
.nav-group a[aria-current="page"]{background:var(--primary-soft);color:var(--primary-text);font-weight:700}
.nav-tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:var(--r-pill);background:var(--surface-3);color:var(--fg-3)}
.nav-empty{padding:10px;color:var(--fg-3);font-size:14px}

.main{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:var(--s10);padding:var(--s10) clamp(16px,4vw,56px) var(--s16);max-width:1260px;width:100%}
.main.no-toc{grid-template-columns:minmax(0,1fr)}
.content{min-width:0;max-width:900px}
.toc{position:sticky;top:calc(var(--topbar) + 32px);align-self:start;font-size:13px}
.toc h4{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3);margin-bottom:8px}
.toc a{display:block;padding:4px 0 4px 12px;border-left:2px solid var(--border);color:var(--fg-3);text-decoration:none}
.toc a:hover{color:var(--fg)}
.toc a.on{border-color:var(--accent);color:var(--fg);font-weight:600}

.page-head{margin-bottom:var(--s8)}
.crumbs{font-size:13px;color:var(--fg-3);margin-bottom:var(--s2)}
.page-head h1{font-size:clamp(30px,4vw,40px);font-weight:800;line-height:1.1;margin-bottom:var(--s3)}
.page-head .lede{font-size:17px;color:var(--fg-2);max-width:65ch}
.ref-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:var(--s4)}
.ref{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:var(--r-pill);border:1px solid var(--border);color:var(--fg-2);text-decoration:none;background:var(--surface)}
.ref:hover{border-color:var(--border-strong);color:var(--fg)}

.section{margin-top:var(--s10);scroll-margin-top:calc(var(--topbar) + 16px)}
.section > h2{font-size:22px;font-weight:700;margin-bottom:var(--s2)}
.section > h2 a{color:inherit;text-decoration:none}
.section > p.desc{color:var(--fg-2);max-width:68ch;margin-bottom:var(--s4)}
.section > p.desc code,.prose code,td code{font-family:var(--mono);font-size:.85em;background:var(--code-bg);padding:1px 5px;border-radius:5px}

.demo{border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}
.demo-stage{padding:clamp(20px,4vw,40px);display:flex;flex-wrap:wrap;gap:var(--s4);align-items:center;justify-content:center;min-height:120px;position:relative}
.demo-stage.start{justify-content:flex-start;align-items:flex-start}
.demo-stage.col{flex-direction:column;align-items:stretch}
.demo-stage.tint{background:var(--surface-2)}
.demo-stage.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));align-items:start}
.demo-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--border);padding:8px 12px;background:var(--surface-2);font-size:12px;color:var(--fg-3)}
.demo-bar .tags{display:flex;gap:6px;flex-wrap:wrap}
.demo-bar .tag{font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:5px;background:var(--surface);border:1px solid var(--border);color:var(--fg-2)}
.demo-bar .dir{all:unset;cursor:pointer;font-weight:600;color:var(--fg-2);padding:2px 8px;border-radius:5px}
.demo-bar .dir:hover{color:var(--fg);background:var(--surface)}
.demo-bar .dir:focus-visible{outline:2px solid var(--focus)}
.phone-w{width:100%;max-width:380px}

.spec{width:100%;border-collapse:collapse;font-size:14px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface)}
.spec th{text-align:left;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap}
.spec td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--fg-2)}
.spec tr:last-child td{border-bottom:0}
.spec td:first-child{color:var(--fg);font-weight:600;white-space:nowrap}

.dd{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
.dd > div{border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s4) var(--s5);background:var(--surface)}
.dd h3{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:8px}
.dd .do h3{color:var(--success)} .dd .dont h3{color:var(--danger)}
.dd ul,.a11y{margin:0;padding-left:18px;color:var(--fg-2)}
.dd li,.a11y li{margin:4px 0}
.a11y li::marker,.dd li::marker{color:var(--accent)}

/* Overview */
.hero{border-radius:var(--r-2xl);background:radial-gradient(circle at 88% 12%,rgba(0,179,235,.35),rgba(0,179,235,0) 45%),radial-gradient(circle at 8% 100%,rgba(94,23,235,.30),rgba(94,23,235,0) 50%),#050A30;color:#fff;padding:clamp(24px,5vw,48px);position:relative;overflow:hidden}
.hero::before{content:none}
.hero > *{position:relative}
.hero .eyebrow{color:#9AA3C7}
.hero h1{font-size:clamp(32px,5vw,52px);font-weight:800;line-height:1.04;margin:10px 0 14px;max-width:18ch}
.hero h1 em{font-style:normal;color:#00B3EB}
.hero p{color:#CBD5E1;max-width:60ch;font-size:16px}
.hero-stats{display:flex;flex-wrap:wrap;gap:var(--s8);margin-top:var(--s8)}
.hero-stats div{display:flex;flex-direction:column}
.hero-stats b{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.hero-stats span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#9AA3C7}
.hero-mods{display:flex;flex-wrap:wrap;gap:8px;margin-top:var(--s6)}
.hero-mods span{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:var(--r-pill);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);font-size:13px;font-weight:600;color:#fff}
.hero-mods i{width:8px;height:8px;border-radius:50%}
.cat{margin-top:var(--s10)}
.cat h2{font-size:20px;margin-bottom:4px}
.cat > p{color:var(--fg-3);margin-bottom:var(--s4)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--s3)}
.ccard{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);text-decoration:none;color:inherit;overflow:hidden;transition:border-color var(--dur-2),transform var(--dur-2) var(--ease)}
.ccard:hover{border-color:var(--border-strong);transform:translateY(-2px)}
.ccard .thumb{height:96px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;gap:8px;border-bottom:1px solid var(--border);overflow:hidden;pointer-events:none;padding:0 12px}
.ccard .meta{padding:12px 14px}
.ccard b{font-size:15px;font-weight:700;display:block}
.ccard span{font-size:13px;color:var(--fg-3)}
.basis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--s3);margin-top:var(--s4)}
.basis > div{border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s4);background:var(--surface)}
.basis b{display:block;margin-bottom:4px}
.basis p{font-size:14px;color:var(--fg-2)}

/* Foundations */
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--s3);width:100%}
.sw{all:unset;cursor:pointer;border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.sw:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sw .chip{height:72px;display:flex;align-items:flex-end;justify-content:flex-end;padding:6px 8px;font:600 11px var(--mono)}
.sw .info{padding:8px 10px;font-size:12px;line-height:1.35}
.sw .info b{display:block;font-size:13px}
.sw .info span{font-family:var(--mono);color:var(--fg-3)}
.scale-row{display:flex;width:100%;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--border)}
.scale-row > button{all:unset;cursor:pointer;flex:1;min-width:0;height:84px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font:600 10px var(--mono)}
.scale-row > button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.type-row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:var(--s4);align-items:baseline;padding:14px 0;border-bottom:1px solid var(--border);width:100%}
.type-row:last-child{border-bottom:0}
.type-row .lbl{font-size:12px;color:var(--fg-3);line-height:1.4}
.type-row .lbl b{display:block;color:var(--fg);font-size:13px}
.weights{display:flex;flex-wrap:wrap;gap:var(--s6);width:100%}
.weights div{display:flex;flex-direction:column;gap:2px}
.weights b{font-size:36px;line-height:1}
.weights span{font-size:12px;color:var(--fg-3)}
.space-row{display:flex;align-items:center;gap:var(--s4);width:100%;font-size:13px}
.space-row .bar{height:14px;background:var(--accent);border-radius:3px}
.space-row .n{width:72px;font-family:var(--mono);color:var(--fg-3)}
.space-row .v{width:48px;font-family:var(--mono)}
.rad{width:96px;height:96px;background:var(--surface-3);border:2px solid var(--fg);display:flex;align-items:flex-end;padding:8px;font:600 11px var(--mono)}
.elev{width:150px;height:96px;background:var(--surface);border-radius:var(--r-lg);display:flex;align-items:flex-end;padding:10px;font-size:12px;border:1px solid var(--border)}
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:var(--s2);width:100%}
.icon-grid button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:var(--r-md);font-size:11px;color:var(--fg-3);text-align:center}
.icon-grid button:hover{background:var(--surface-2);color:var(--fg)}
.icon-grid button:focus-visible{outline:2px solid var(--focus)}
.icon-grid .ico{width:24px;height:24px;color:var(--fg)}
.motion-demo{display:flex;flex-direction:column;gap:12px;width:100%}
.motion-track{position:relative;height:36px;background:var(--surface-2);border-radius:var(--r-pill)}
.motion-dot{position:absolute;left:4px;top:4px;width:28px;height:28px;border-radius:50%;background:var(--accent)}
.motion-track.go .motion-dot{left:calc(100% - 32px)}

/* ================= COMPONENTS (prefix en-) ================= */
.en-btn{--h:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--h);padding:0 20px;border-radius:var(--r-md);border:1px solid transparent;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background var(--dur-1),border-color var(--dur-1),color var(--dur-1),transform var(--dur-1);user-select:none}
.en-btn:active{transform:translateY(1px)}
.en-btn.sm{--h:34px;padding:0 14px;font-size:13px;border-radius:var(--r-sm)}
.en-btn.lg{--h:52px;padding:0 28px;font-size:16px;border-radius:var(--r-lg)}
.en-btn.block{width:100%}
.en-btn.primary{background:var(--primary);color:var(--on-primary)}
.en-btn.primary:hover{background:var(--primary-hover)}
.en-btn.primary:active{background:var(--primary-press)}
.en-btn.dark{background:var(--inverse);color:var(--on-inverse)}
.en-btn.dark:hover{opacity:.88}
.en-btn.outline{background:var(--surface);border-color:var(--border);color:var(--fg)}
.en-btn.outline:hover{border-color:var(--border-strong);background:var(--surface-2)}
.en-btn.soft{background:var(--primary-soft);color:var(--primary-text)}
.en-btn.soft:hover{filter:brightness(.97)}
.en-btn.accent{background:var(--accent);color:var(--on-accent)}
.en-btn.accent:hover{filter:brightness(1.06)}
.en-btn.tenant{background:var(--tenant);color:var(--on-tenant)}
.en-btn.tenant:hover{background:var(--tenant-hover)}
.en-btn.wallet{background:#000;color:#fff}
.en-btn.wallet:hover{background:#1a1a1a}
.en-btn.ghost{background:transparent;color:var(--fg-2)}
.en-btn.ghost:hover{background:var(--surface-3);color:var(--fg)}
.en-btn.link{background:none;height:auto;padding:0;color:var(--fg);text-decoration:underline;text-underline-offset:3px;font-weight:700}
.en-btn[disabled],.en-btn[aria-disabled="true"]{opacity:.42;cursor:not-allowed;transform:none}
.en-btn .spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.en-iconbtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface);color:var(--fg);cursor:pointer}
.en-iconbtn:hover{background:var(--surface-2)}
.en-iconbtn.sm{width:34px;height:34px;border-radius:var(--r-sm)}
.en-iconbtn.ghost{border-color:transparent;background:transparent}
.en-iconbtn.ghost:hover{background:var(--surface-3)}
.en-iconbtn.filled{background:var(--inverse);color:var(--on-inverse);border-color:var(--inverse)}
.en-iconbtn.round{border-radius:50%}

.en-btngroup{display:inline-flex;border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;background:var(--surface)}
.en-btngroup button{all:unset;cursor:pointer;padding:0 16px;height:40px;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;color:var(--fg-2);border-inline-start:1px solid var(--border)}
.en-btngroup button:first-child{border-inline-start:0}
.en-btngroup button:hover{background:var(--surface-2);color:var(--fg)}
.en-btngroup button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}

/* Segmented (salutation) */
.en-seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px;width:100%;max-width:360px}
.en-seg label{position:relative;display:flex;align-items:center;justify-content:center;height:46px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);cursor:pointer;font-weight:500;color:var(--fg-2);transition:all var(--dur-1)}
.en-seg input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.en-seg label:hover{border-color:var(--border-strong)}
.en-seg label:has(input:checked){border-color:var(--fg);color:var(--fg);font-weight:700;box-shadow:inset 0 0 0 1px var(--fg)}
.en-seg label:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:2px}
.en-seg.pill{background:var(--surface-3);padding:4px;border-radius:var(--r-pill);gap:4px}
.en-seg.pill label{border:0;height:36px;border-radius:var(--r-pill);background:transparent}
.en-seg.pill label:has(input:checked){background:var(--surface);box-shadow:var(--shadow-1)}

/* Checkbox / radio / switch */
.en-check{display:inline-flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:15px;color:var(--fg)}
.en-check input{appearance:none;margin:2px 0 0;width:20px;height:20px;flex:none;border:1.5px solid var(--border-strong);border-radius:6px;background:var(--surface);display:grid;place-content:center;cursor:pointer;transition:all var(--dur-1)}
.en-check input::after{content:"";width:10px;height:6px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px) scale(0);transition:transform var(--dur-1) var(--ease)}
.en-check input:checked{background:var(--primary);border-color:var(--primary)}
.en-check input::after{border-color:var(--on-primary)}
.en-check input:checked::after{transform:rotate(-45deg) translate(1px,-1px) scale(1)}
.en-check input:indeterminate{background:var(--primary);border-color:var(--primary)}
.en-check input:indeterminate::after{width:10px;height:0;border:0;border-top:2px solid var(--on-primary);transform:none}
.en-check input[type=radio]{border-radius:50%}
.en-check input[type=radio]::after{width:8px;height:8px;border:0;border-radius:50%;background:var(--on-primary);transform:scale(0)}
.en-check input[type=radio]:checked::after{transform:scale(1)}
.en-check input:disabled{opacity:.45;cursor:not-allowed}
.en-check:has(input:disabled){color:var(--fg-3);cursor:not-allowed}
.en-check small{display:block;color:var(--fg-3);font-size:13px}
.en-check input.err{border-color:var(--danger)}
.en-switch{display:inline-flex;align-items:center;gap:12px;cursor:pointer}
.en-switch input{appearance:none;margin:0;width:44px;height:26px;border-radius:var(--r-pill);background:var(--slate-300);position:relative;cursor:pointer;transition:background var(--dur-2)}
:root[data-theme="dark"] .en-switch input{background:var(--border-strong)}
.en-switch input::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:inset-inline-start var(--dur-2) var(--ease)}
.en-switch input:checked{background:var(--primary)}
.en-switch input:checked::after{inset-inline-start:21px}
.en-switch input:disabled{opacity:.45;cursor:not-allowed}
.en-switch.sm input{width:34px;height:20px}.en-switch.sm input::after{width:14px;height:14px}.en-switch.sm input:checked::after{inset-inline-start:17px}

/* Fields */
.en-field{display:flex;flex-direction:column;gap:6px;width:100%;max-width:360px}
.en-field > label,.en-label{font-size:13px;font-weight:600;color:var(--fg)}
.en-input{position:relative;display:flex;align-items:center;height:48px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);transition:border-color var(--dur-1),box-shadow var(--dur-1)}
.en-input:hover{border-color:var(--border-strong)}
.en-input:focus-within{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.en-input input,.en-input select,.en-input textarea{all:unset;box-sizing:border-box;flex:1;min-width:0;height:100%;padding:0 14px;font-size:15px;color:var(--fg)}
.en-input input::placeholder,.en-input textarea::placeholder{color:var(--placeholder)}
.en-input .adorn{display:flex;align-items:center;padding:0 12px;color:var(--fg-3);font-size:14px;gap:6px}
.en-input .adorn + input{padding-inline-start:0}
.en-input.err{border-color:var(--danger)}
.en-input.err:focus-within{box-shadow:0 0 0 1px var(--danger)}
.en-input.dis{background:var(--surface-3);opacity:.65}
.en-input.sm{height:38px}
.en-input.area{height:auto}
.en-input.area textarea{padding:12px 14px;min-height:96px;white-space:pre-wrap}
.en-help{font-size:12.5px;color:var(--fg-3)}
.en-help.err{color:var(--danger);display:flex;gap:6px;align-items:center}
.en-help.ok{color:var(--success)}
.opt{color:var(--placeholder)}
.en-phone{display:grid;grid-template-columns:110px 1fr;gap:10px;width:100%;max-width:360px}
.en-phone .cc{all:unset;box-sizing:border-box;cursor:pointer;height:48px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-weight:700}
.en-phone .cc:focus-visible{outline:2px solid var(--focus)}
.en-mask{position:relative;flex:1;height:100%}
.en-mask input{position:absolute;inset:0;background:transparent;z-index:1;font-variant-numeric:tabular-nums}
.en-mask .ghost{position:absolute;inset:0;display:flex;align-items:center;padding:0 14px;font-size:15px;color:var(--placeholder);pointer-events:none;white-space:pre;font-variant-numeric:tabular-nums}
.en-mask .ghost .typed{visibility:hidden}
.en-mask .rest-label{position:absolute;inset-inline-end:14px;top:0;bottom:0;display:flex;align-items:center;font-size:13px;color:var(--placeholder);pointer-events:none}

/* Select / menu / popover */
.en-pop-wrap{position:relative;display:inline-block}
.en-pop-wrap.full{display:block;width:100%;max-width:360px}
.en-select-btn{all:unset;box-sizing:border-box;cursor:pointer;width:100%;height:48px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 14px;font-size:15px}
.en-select-btn:hover{border-color:var(--border-strong)}
.en-select-btn:focus-visible,.en-select-btn[aria-expanded="true"]{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.en-select-btn .val.ph{color:var(--placeholder)}
.en-menu{position:absolute;z-index:30;top:calc(100% + 6px);inset-inline-start:0;min-width:220px;width:max-content;max-width:min(320px,80vw);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-3);padding:6px;list-style:none;margin:0;max-height:280px;overflow:auto}
.en-pop-wrap.full .en-menu{width:100%;max-width:none}
.en-menu[hidden]{display:none}
.en-menu li[role=option],.en-menu li[role=menuitem],.en-menu .mi{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);cursor:pointer;font-size:14px;color:var(--fg)}
.en-menu li:hover,.en-menu li.active{background:var(--surface-3)}
.en-menu li[aria-selected="true"]{font-weight:700}
.en-menu li[aria-selected="true"]::after{content:"";margin-inline-start:auto;width:10px;height:6px;border:2px solid var(--primary);border-top:0;border-right:0;transform:rotate(-45deg)}
.en-menu li.danger{color:var(--danger)}
.en-menu .sep{height:1px;background:var(--border);margin:6px 4px;padding:0}
.en-menu .grp{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3);padding:8px 10px 4px;cursor:default}
.en-menu .kbd{margin-inline-start:auto;font:600 11px var(--mono);color:var(--fg-3)}
.en-menu .empty{padding:10px;color:var(--fg-3);font-size:14px;cursor:default}

/* Slider */
.en-slider{width:100%;max-width:360px;display:flex;flex-direction:column;gap:8px}
.en-slider .top{display:flex;justify-content:space-between;font-size:14px}
.en-slider .top b{font-variant-numeric:tabular-nums}
.en-slider input{appearance:none;width:100%;height:6px;border-radius:var(--r-pill);background:linear-gradient(to right,var(--primary) var(--p,50%),var(--surface-3) var(--p,50%));margin:10px 0;cursor:pointer}
[dir=rtl] .en-slider input{background:linear-gradient(to left,var(--primary) var(--p,50%),var(--surface-3) var(--p,50%))}
.en-slider input::-webkit-slider-thumb{appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--primary);box-shadow:var(--shadow-2)}
.en-slider input::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--primary)}
.en-slider .ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--fg-3);font-variant-numeric:tabular-nums}

.en-rating{display:inline-flex;flex-direction:row-reverse;gap:2px}
.en-rating input{position:absolute;opacity:0;width:0}
.en-rating label{cursor:pointer;color:var(--slate-300);padding:2px}
:root[data-theme="dark"] .en-rating label{color:var(--border-strong)}
.en-rating label svg{width:28px;height:28px;fill:currentColor;stroke:none}
.en-rating input:checked ~ label,.en-rating label:hover,.en-rating label:hover ~ label{color:var(--tier-gold)}
.en-rating input:focus-visible + label{outline:2px solid var(--focus);border-radius:4px}

.en-qty{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:var(--r-pill);background:var(--surface);height:40px}
.en-qty button{all:unset;cursor:pointer;width:40px;height:40px;display:grid;place-items:center;color:var(--fg)}
.en-qty button:disabled{color:var(--fg-3);opacity:.5;cursor:not-allowed}
.en-qty button:focus-visible{outline:2px solid var(--focus);border-radius:50%}
.en-qty output{min-width:28px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}

.en-upload{width:100%;max-width:420px;border:1.5px dashed var(--border-strong);border-radius:var(--r-lg);padding:28px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;background:var(--surface);cursor:pointer;color:var(--fg-2);font-size:14px}
.en-upload:hover,.en-upload.drag{border-color:var(--accent);background:var(--accent-soft)}
.en-upload b{color:var(--fg)}
.en-upload input{display:none}

/* Data display */
.en-avatar{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:15px;background:var(--surface-3);color:var(--fg);flex:none;position:relative;overflow:visible}
.en-avatar.sm{width:28px;height:28px;font-size:11px}.en-avatar.lg{width:56px;height:56px;font-size:20px}
.en-avatar.red{background:var(--accent-soft);color:var(--accent-text)}
.en-avatar.purple{background:color-mix(in srgb,var(--rewards) 14%,transparent);color:var(--rewards-text)}
.en-avatar.ink{background:var(--inverse);color:var(--on-inverse)}
.en-avatar.sq{border-radius:var(--r-md)}
.en-avatar .st{position:absolute;bottom:0;inset-inline-end:0;width:11px;height:11px;border-radius:50%;background:var(--success);border:2px solid var(--surface)}
.en-avatars{display:flex}
.en-avatars .en-avatar{border:2px solid var(--surface);margin-inline-start:-10px}
.en-avatars .en-avatar:first-child{margin-inline-start:0}
.en-badge-wrap{position:relative;display:inline-flex}
.en-badge{position:absolute;top:-6px;inset-inline-end:-6px;min-width:20px;height:20px;padding:0 6px;border-radius:var(--r-pill);background:var(--coral);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--surface);font-variant-numeric:tabular-nums}
.en-badge.dot{min-width:12px;width:12px;height:12px;padding:0;top:-2px;inset-inline-end:-2px}
.en-badge.ink{background:var(--inverse);color:var(--on-inverse)}
.en-chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r-pill);font-size:13px;font-weight:600;border:1px solid var(--border);background:var(--surface);color:var(--fg-2);white-space:nowrap}
button.en-chip{cursor:pointer}
button.en-chip:hover{border-color:var(--border-strong);color:var(--fg)}
.en-chip[aria-pressed="true"]{background:var(--inverse);color:var(--on-inverse);border-color:var(--inverse)}
.en-chip.sm{height:24px;padding:0 9px;font-size:12px}
.en-chip .x{all:unset;cursor:pointer;display:grid;place-items:center;width:18px;height:18px;border-radius:50%;margin-inline-end:-6px;color:var(--fg-3)}
.en-chip .x:hover{background:var(--surface-3);color:var(--fg)}
.en-chip.red,.en-chip.accent{background:var(--accent-soft);border-color:transparent;color:var(--accent-text)}
.en-chip.rewards{background:color-mix(in srgb,var(--rewards) 12%,transparent);border-color:transparent;color:var(--rewards-text)}
.en-chip.engage{background:color-mix(in srgb,var(--engage) 14%,transparent);border-color:transparent;color:var(--engage-text)}
.en-chip.fulfill{background:color-mix(in srgb,var(--fulfill) 14%,transparent);border-color:transparent;color:var(--fulfill-text)}
.en-chip.danger{background:var(--danger-50);border-color:transparent;color:var(--danger)}
.en-chip.success{background:var(--success-50);border-color:transparent;color:var(--success)}
.en-chip.warning{background:var(--warning-50);border-color:transparent;color:var(--warning)}
.en-chip.info{background:var(--info-50);border-color:transparent;color:var(--info)}
.en-chip.gold{background:var(--tier-gold-50);border-color:transparent;color:var(--warning)}
.en-chip.dark{background:var(--inverse);color:var(--on-inverse);border-color:transparent}
.en-chip .dt{width:7px;height:7px;border-radius:50%;background:currentColor}
.en-divider{border:0;border-top:1px solid var(--border);margin:0;width:100%}
.en-divider-label{display:flex;align-items:center;gap:12px;width:100%;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--fg-3)}
.en-divider-label::before,.en-divider-label::after{content:"";flex:1;border-top:1px solid var(--border)}
.en-divider-label.start::before{display:none}
.en-vdiv{width:1px;align-self:stretch;background:var(--border)}
.en-list{list-style:none;margin:0;padding:6px;width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg)}
.en-list li{display:flex;align-items:center;gap:12px;padding:10px;border-radius:var(--r-md)}
.en-list li.click{cursor:pointer}
.en-list li.click:hover{background:var(--surface-2)}
.en-list .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.en-list .tx b{font-size:14.5px;font-weight:700}
.en-list .tx span{font-size:13px;color:var(--fg-3)}
.en-list .tr{font-size:13px;color:var(--fg-3);font-variant-numeric:tabular-nums;text-align:end}
.en-list.plain{border:0;padding:0;background:none}
.en-list.sep li{border-radius:0;border-bottom:1px solid var(--border)}
.en-list.sep li:last-child{border-bottom:0}
.en-tile{width:40px;height:40px;border-radius:var(--r-md);background:var(--primary-soft);color:var(--primary-text);display:grid;place-items:center;flex:none}
.en-tile.n{background:var(--surface-3);color:var(--fg-2)}
.en-table-wrap{width:100%;overflow-x:auto;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface)}
.en-table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
.en-table th{text-align:start;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3);padding:12px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
.en-table th button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.en-table th button:focus-visible{outline:2px solid var(--focus)}
.en-table td{padding:12px 14px;border-bottom:1px solid var(--border);color:var(--fg-2)}
.en-table tr:last-child td{border-bottom:0}
.en-table tbody tr:hover{background:var(--surface-2)}
.en-table .num{text-align:end;font-variant-numeric:tabular-nums}
.en-table td b{color:var(--fg)}
.en-table .who{display:flex;align-items:center;gap:10px}
.en-table-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--border);font-size:13px;color:var(--fg-3)}
.en-tip{position:relative;display:inline-flex}
.en-tip [role=tooltip]{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translate(-50%,4px);background:var(--inverse);color:var(--on-inverse);font-size:12px;font-weight:600;padding:6px 10px;border-radius:var(--r-sm);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity var(--dur-1),transform var(--dur-1);z-index:20}
.en-tip [role=tooltip]::after{content:"";position:absolute;top:100%;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:var(--inverse)}
.en-tip.bottom [role=tooltip]{bottom:auto;top:calc(100% + 8px)}
.en-tip.bottom [role=tooltip]::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:var(--inverse)}
.en-tip:hover [role=tooltip],.en-tip:focus-within [role=tooltip],.en-tip.show [role=tooltip]{opacity:1;transform:translate(-50%,0)}
.en-stat{flex:1 1 200px;min-width:0;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.en-stat .k{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3)}
.en-stat .v{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.en-stat .d{font-size:13px;font-weight:600;display:flex;align-items:center;gap:4px}
.en-stat .d.up{color:var(--success)} .en-stat .d.down{color:var(--danger)}
.en-stat svg.spark{width:100%;height:36px}
.en-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:28px;max-width:360px}
.en-empty .art{width:64px;height:64px;border-radius:var(--r-xl);background:var(--primary-soft);color:var(--primary-text);display:grid;place-items:center}
.en-empty b{font-size:17px}
.en-empty p{color:var(--fg-3);font-size:14px}
.en-kbd{font:600 12px var(--mono);border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:6px;padding:2px 6px;background:var(--surface);color:var(--fg)}

/* Feedback */
.en-alert{display:flex;gap:12px;align-items:flex-start;width:100%;max-width:560px;padding:14px 16px;border-radius:var(--r-lg);border:1px solid var(--border);background:var(--surface);font-size:14px;color:var(--fg-2)}
.en-alert .ico{margin-top:1px}
.en-alert .bd{flex:1;min-width:0}
.en-alert b{display:block;color:var(--fg);font-size:14.5px;margin-bottom:2px}
.en-alert.info{background:var(--info-50);border-color:transparent}.en-alert.info > .ico{color:var(--info)}
.en-alert.success{background:var(--success-50);border-color:transparent}.en-alert.success > .ico{color:var(--success)}
.en-alert.warning{background:var(--warning-50);border-color:transparent}.en-alert.warning > .ico{color:var(--warning)}
.en-alert.error{background:var(--danger-50);border-color:transparent}.en-alert.error > .ico{color:var(--danger)}
.en-alert .acts{display:flex;gap:8px;margin-top:10px}
.en-alert .close{all:unset;cursor:pointer;color:var(--fg-3);border-radius:6px;display:grid;place-items:center;width:24px;height:24px}
.en-alert .close:hover{color:var(--fg);background:var(--surface-3)}
.en-reminder{display:flex;align-items:center;gap:12px;width:100%;max-width:380px;padding:12px 12px 12px 14px;border:1px solid var(--border);border-inline-start:2px solid var(--tenant);border-radius:var(--r-md);background:var(--surface);font-size:13px;color:var(--fg-2)}
.en-reminder p{flex:1}
.en-confirm{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:var(--fg-3)}
.en-confirm .ico{color:var(--success)}

dialog.en-dialog{border:0;padding:0;border-radius:var(--r-xl);background:var(--surface);color:var(--fg);box-shadow:var(--shadow-3);width:min(440px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog.en-dialog::backdrop{background:var(--scrim)}
dialog.en-dialog[open]{animation:pop var(--dur-3) var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
.en-dialog .dh{padding:22px 24px 6px;display:flex;align-items:flex-start;gap:12px}
.en-dialog .dh h3{font-size:19px;flex:1}
.en-dialog .db{padding:4px 24px 8px;color:var(--fg-2);font-size:14.5px}
.en-dialog .df{padding:16px 24px 22px;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.en-dialog .df.stack{flex-direction:column}
dialog.en-sheet{border:0;padding:0;margin:auto auto 0;width:min(440px,100vw);max-width:100vw;border-radius:var(--r-2xl) var(--r-2xl) 0 0;background:var(--surface);color:var(--fg);box-shadow:var(--shadow-3);padding-bottom:env(safe-area-inset-bottom,0px)}
dialog.en-sheet::backdrop{background:var(--scrim)}
dialog.en-sheet[open]{animation:sheet var(--dur-3) var(--ease)}
@keyframes sheet{from{transform:translateY(40px);opacity:.4}}
.en-sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--border-strong);margin:10px auto 6px}
.en-sheet .sb{padding:12px 20px 20px;display:flex;flex-direction:column;gap:14px}
.en-sheet h3{font-size:22px;font-weight:800}
.en-sheet p.sub{color:var(--fg-3);font-size:14px}
.en-checks{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;font-size:14px}
.en-checks li{display:flex;gap:10px;align-items:flex-start}
.en-checks .ck{width:18px;height:18px;border-radius:50%;background:var(--tenant-soft);color:var(--tenant-text);display:grid;place-items:center;flex:none;margin-top:1px}
.en-checks .ck .ico{width:11px;height:11px;stroke-width:3}
.en-checks.sm{font-size:13px;gap:8px}
.en-snack-host{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:200;width:min(440px,calc(100vw - 32px))}
.en-snack{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 16px;border-radius:var(--r-lg);background:var(--inverse);color:var(--on-inverse);font-size:14px;font-weight:500;box-shadow:var(--shadow-3);animation:pop var(--dur-3) var(--ease)}
.en-snack .ico{color:currentColor}
.en-snack.ok .ico.lead{color:#4ADE80}
:root[data-theme="dark"] .en-snack.ok .ico.lead{color:var(--success)}
.en-snack span{flex:1}
.en-snack button{all:unset;cursor:pointer;font-weight:700;color:var(--cyan);padding:4px 6px;border-radius:6px}
.en-snack button:focus-visible{outline:2px solid currentColor}
.en-progress{width:100%;max-width:420px;height:8px;border-radius:var(--r-pill);background:var(--surface-3);overflow:hidden}
.en-progress > i{display:block;height:100%;width:var(--v,40%);background:var(--primary);border-radius:inherit;transition:width var(--dur-3) var(--ease)}
.en-progress.ind > i{width:35%;animation:ind 1.3s var(--ease) infinite}
@keyframes ind{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
.en-progress.sm{height:4px}
.en-progress.dark > i{background:var(--inverse)}
.en-ring{width:44px;height:44px;transform:rotate(-90deg)}
.en-ring circle{fill:none;stroke-width:4}
.en-ring .t{stroke:var(--surface-3)} .en-ring .v{stroke:var(--primary);stroke-linecap:round;transition:stroke-dashoffset var(--dur-3)}
.en-ring.spin{animation:spin 1s linear infinite}
.en-skel{background:linear-gradient(90deg,var(--surface-3) 25%,var(--surface-2) 50%,var(--surface-3) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:var(--r-sm)}
@keyframes shimmer{to{background-position:-200% 0}}

/* Surfaces */
.en-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;width:100%;max-width:360px}
.en-card .cb{padding:16px 18px}
.en-card .ch{padding:16px 18px 0;display:flex;align-items:center;gap:12px}
.en-card h3{font-size:17px}
.en-card .cf{padding:12px 18px 16px;display:flex;gap:8px}
.en-card .media{height:150px;background:var(--ink);position:relative;overflow:hidden}
.en-card .media::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 1px,transparent 1px 18px),repeating-linear-gradient(-45deg,rgba(255,255,255,.05) 0 1px,transparent 1px 18px)}
.en-card.elev{border-color:transparent;box-shadow:var(--shadow-2)}
.en-card.tint{background:var(--surface-2)}
.en-card.click{cursor:pointer;transition:border-color var(--dur-2)}
.en-card.click:hover{border-color:var(--border-strong)}
.en-card p{color:var(--fg-3);font-size:14px}
.en-acc{width:100%;max-width:560px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}
.en-acc details{border-bottom:1px solid var(--border)}
.en-acc details:last-child{border-bottom:0}
.en-acc summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;font-weight:700;font-size:15px}
.en-acc summary::-webkit-details-marker{display:none}
.en-acc summary .ico{transition:transform var(--dur-2) var(--ease);color:var(--fg-3)}
.en-acc details[open] summary .ico{transform:rotate(180deg)}
.en-acc summary:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.en-acc .ab{padding:0 18px 16px;color:var(--fg-2);font-size:14px}
.en-acc.split{border:0;background:none;display:flex;flex-direction:column;gap:8px}
.en-acc.split details{border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface)}
.en-appbar{display:flex;align-items:center;gap:10px;width:100%;height:56px;padding:0 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg)}
.en-appbar .t{font-weight:800;font-size:16px;flex:1}
.en-appbar.ink{background:var(--ink);color:#fff;border-color:var(--ink)}
.en-appbar.ink .en-iconbtn{background:transparent;border-color:transparent;color:#fff}
.en-appbar.ink .en-iconbtn:hover{background:rgba(255,255,255,.1)}
.en-lang-pill{all:unset;cursor:pointer;font-size:12.5px;font-weight:600;padding:5px 12px;border:1px solid var(--border);border-radius:var(--r-pill);background:var(--surface);font-family:var(--font-ar)}
.en-lang-pill:focus-visible{outline:2px solid var(--focus)}
.en-paper{width:140px;height:96px;border-radius:var(--r-lg);background:var(--surface);display:flex;align-items:flex-end;padding:10px;font-size:12px;color:var(--fg-3)}

/* Navigation */
.en-tabs{width:100%}
.en-tablist{display:flex;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto}
.en-tablist button{all:unset;cursor:pointer;padding:12px 14px;font-weight:600;font-size:14px;color:var(--fg-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.en-tablist button:hover{color:var(--fg)}
.en-tablist button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.en-tablist button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.en-tabpanel{padding:16px 2px;color:var(--fg-2);font-size:14px}
.en-tabs.pill .en-tablist{border:0;background:var(--surface-3);padding:4px;border-radius:var(--r-pill);display:inline-flex}
.en-tabs.pill .en-tablist button{border:0;margin:0;padding:8px 16px;border-radius:var(--r-pill)}
.en-tabs.pill .en-tablist button[aria-selected="true"]{background:var(--accent);color:var(--on-accent);box-shadow:none}
.en-crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px;list-style:none;margin:0;padding:0}
.en-crumbs a{color:var(--fg-3);text-decoration:none}
.en-crumbs a:hover{color:var(--fg);text-decoration:underline}
.en-crumbs li{display:flex;align-items:center;gap:6px}
.en-crumbs li + li::before{content:"/";color:var(--border-strong)}
.en-crumbs [aria-current]{color:var(--fg);font-weight:700}
.en-pager{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.en-pager button{all:unset;cursor:pointer;min-width:36px;height:36px;padding:0 6px;box-sizing:border-box;border-radius:var(--r-sm);display:grid;place-items:center;font-weight:600;font-size:14px;color:var(--fg-2);font-variant-numeric:tabular-nums}
.en-pager button:hover{background:var(--surface-3)}
.en-pager button[aria-current="page"]{background:var(--inverse);color:var(--on-inverse)}
.en-pager button:disabled{opacity:.4;cursor:not-allowed}
.en-pager button:focus-visible{outline:2px solid var(--focus)}
.en-pager .gap{color:var(--fg-3);padding:0 4px}
.en-pager.outlined button{border:1px solid var(--border)}
.en-link{color:var(--fg);font-weight:700;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.en-link:hover{color:var(--primary-text)}
.en-link.muted{color:var(--fg-3);font-weight:500}
.en-link.red{color:var(--primary-text);text-decoration:none}
.en-link.red:hover{text-decoration:underline}
.en-link .ico{vertical-align:-3px}
.en-steps{display:flex;width:100%;max-width:640px;list-style:none;margin:0;padding:0}
.en-steps li{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;font-size:13px;color:var(--fg-3);text-align:center}
.en-steps li::before{content:"";position:absolute;top:15px;inset-inline-start:calc(-50% + 20px);inset-inline-end:calc(50% + 20px);height:2px;background:var(--border)}
.en-steps li:first-child::before{display:none}
.en-steps li.done::before,.en-steps li.cur::before{background:var(--primary)}
.en-steps .n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;border:2px solid var(--border);background:var(--surface);color:var(--fg-3);font-variant-numeric:tabular-nums}
.en-steps li.done .n{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.en-steps li.cur .n{border-color:var(--primary);color:var(--primary-text)}
.en-steps li.cur{color:var(--fg);font-weight:700}
.en-dots{display:flex;gap:6px}
.en-dots i{width:8px;height:8px;border-radius:var(--r-pill);background:var(--border-strong);transition:width var(--dur-2)}
.en-dots i.on{width:22px;background:var(--accent)}
.en-bnav{display:flex;width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:6px}
.en-bnav button{all:unset;cursor:pointer;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;font-size:11.5px;font-weight:600;color:var(--fg-3);border-radius:var(--r-md)}
.en-bnav button[aria-current="page"]{color:var(--accent-text)}
.en-bnav button[aria-current="page"] .ico{stroke-width:2.2}
.en-bnav button:focus-visible{outline:2px solid var(--focus)}
.en-drawer-demo{position:relative;width:100%;height:320px;border-radius:var(--r-lg);overflow:hidden;background:var(--surface-2);border:1px solid var(--border)}
.en-drawer-demo .scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity var(--dur-2)}
.en-drawer-demo .panel{position:absolute;top:0;bottom:0;inset-inline-start:0;width:260px;max-width:80%;background:var(--surface);border-inline-end:1px solid var(--border);transform:translateX(-100%);transition:transform var(--dur-3) var(--ease);padding:16px 10px;display:flex;flex-direction:column;gap:2px}
[dir=rtl] .en-drawer-demo .panel{transform:translateX(100%)}
.en-drawer-demo.open .panel{transform:none}
.en-drawer-demo.open .scrim{opacity:1;pointer-events:auto}
.en-drawer-demo .body{padding:16px;display:flex;flex-direction:column;gap:12px}
.en-navitem{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-md);font-size:14px;font-weight:600;color:var(--fg-2)}
.en-navitem:hover{background:var(--surface-3)}
.en-navitem[aria-current="page"]{background:var(--primary-soft);color:var(--primary-text)}
.en-navitem:focus-visible{outline:2px solid var(--focus)}
.en-navitem .en-chip{margin-inline-start:auto}

/* Layout */
.lay-box{background:var(--accent-soft);color:var(--accent-text);border-radius:var(--r-sm);padding:14px;font:600 12px var(--mono);text-align:center}
.lay-grid{display:grid;gap:12px;width:100%}
.lay-stack{display:flex;gap:12px;width:100%}
.lay-container{width:100%;border:1px dashed var(--border-strong);border-radius:var(--r-md);padding:12px}
.lay-container > div{max-width:70%;margin:0 auto}

/* ================= Loyalty patterns ================= */
.phone{width:100%;max-width:380px;border:1px solid var(--border);border-radius:var(--r-2xl);background:var(--slate-25);padding:14px 14px 18px;color:var(--ink);display:flex;flex-direction:column;gap:14px;font-family:var(--font)}
:root[data-theme="dark"] .phone{background:var(--surface-2);color:var(--fg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .phone{background:var(--surface-2);color:var(--fg)}}
.phone .status{display:flex;justify-content:space-between;font-size:12px;font-weight:700;padding:0 6px}
.tenant-logo{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;border:2.5px solid #111;border-radius:12px;padding:6px 14px;background:#fff;color:#111;line-height:1;font-weight:900}
.tenant-logo b{font-size:20px;letter-spacing:.02em}
.tenant-logo small{font-size:10px;letter-spacing:.2em;margin-top:2px}
.tenant-logo.sm{padding:4px 8px;border-width:2px;border-radius:8px}
.tenant-logo.sm b{font-size:11px}.tenant-logo.sm small{font-size:7px}
.en-lang{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);font-weight:700;font-size:16px;color:var(--fg)}
.en-lang:hover{border-color:var(--border-strong)}
.en-lang:focus-visible{outline:2px solid var(--focus)}
.en-lang[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.en-lang .code{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
:root[data-theme="dark"] .en-lang .code{background:#fff;color:var(--ink)}
.ar{font-family:var(--font-ar)}
.en-powered{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;color:var(--fg-3)}
.en-powered img{width:17px;height:16px}
.en-powered a{color:var(--fg);font-weight:700;text-decoration:underline;text-underline-offset:2px}
.mcard{width:100%;max-width:380px;border-radius:var(--r-xl);background:#0B0B0C;color:#fff;padding:18px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow-2)}
.mcard::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(60deg,rgba(255,255,255,.035) 0 1px,transparent 1px 26px),repeating-linear-gradient(-60deg,rgba(255,255,255,.035) 0 1px,transparent 1px 26px);pointer-events:none}
.mcard > *{position:relative}
.mcard .top{display:flex;justify-content:space-between;align-items:flex-start}
.mcard .who{text-align:end}
.mcard .lbl{font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#8A8F98}
.mcard .name{font-size:18px;font-weight:700}
.mcard .row{display:flex;justify-content:space-between;align-items:baseline}
.mcard .cnt{font-weight:800;font-variant-numeric:tabular-nums;font-size:15px}
.mcard .cups{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.mcard .cups svg{width:100%;height:auto;max-height:34px}
.mcard .cups .cup{fill:#1c1c1e;stroke:#5a5d63;stroke-width:1.6}
.mcard .cups .on .cup{fill:var(--tenant);stroke:var(--tenant)}
.mcard .cups .on .tick{opacity:1}
.mcard .tick{fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.mcard .note{font-size:12.5px;color:#9AA0AA}
.meter{position:relative;height:44px;margin:0 10px}
.meter .track{position:absolute;top:13px;left:0;right:0;height:4px;border-radius:4px;background:#2A2A2D}
.meter .fill{position:absolute;top:13px;left:0;height:4px;border-radius:4px;background:var(--tenant);width:0;transition:width var(--dur-3) var(--ease)}
.meter .knob{position:absolute;top:3px;width:24px;height:24px;margin-left:-12px;border-radius:50%;border:1px solid #3a3a3d}
.meter .knob.silver{background:#5C6068}.meter .knob.gold{background:#8C7135}.meter .knob.black{background:#1A1A1C}
.meter .knob.hit{box-shadow:0 0 0 3px var(--tenant)}
.meter .knob.silver.hit{background:var(--tier-silver)}.meter .knob.gold.hit{background:var(--tier-gold)}.meter .knob.black.hit{background:#000;border-color:#888}
.meter .tl{position:absolute;top:30px;transform:translateX(-50%);text-align:center;font-size:9.5px;letter-spacing:.12em;color:#8A8F98;line-height:1.2;font-variant-numeric:tabular-nums}
[dir=rtl] .meter{transform:scaleX(-1)} [dir=rtl] .meter .tl{transform:translateX(-50%) scaleX(-1)}
.mcard.mini{padding:14px;gap:10px}
.tier{width:100%;max-width:380px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:12px;color:var(--fg)}
.tier h4{font-size:17px;font-weight:800}
.tier h4 em{font-style:normal;color:var(--tenant-text)}
.tier .sub{font-size:12.5px;color:var(--fg-3);margin-top:-8px}
.tier .then{display:flex;flex-direction:column;gap:12px}
.tier .t-row{display:grid;grid-template-columns:18px 1fr auto;gap:4px 10px;align-items:baseline;font-size:13px}
.tier .t-row i{width:16px;height:16px;border-radius:50%;align-self:center}
.tier .t-row b{font-size:14px}
.tier .t-row span{color:var(--fg-3);font-variant-numeric:tabular-nums}
.tier .t-row p{grid-column:2 / -1;color:var(--fg-3);font-size:12.5px}
.how{display:flex;flex-direction:column;gap:8px;width:100%;max-width:380px}
.how-item{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);color:var(--fg)}
.how-item .en-tile{width:40px;height:40px}
.how-item b{font-size:14px;display:block}
.how-item span{font-size:12.5px;color:var(--fg-3)}
.actionbar{display:flex;gap:10px;width:100%;max-width:380px;padding:12px;border-top:1px solid var(--border);background:var(--surface);border-radius:0 0 var(--r-xl) var(--r-xl)}
.actionbar .en-btn{flex:1}

@media (max-width:1180px){.main{grid-template-columns:minmax(0,1fr)}.toc{display:none}}
@media (max-width:960px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .menu-btn{display:inline-flex}
  .sidenav{position:fixed;top:calc(var(--topbar) + env(safe-area-inset-top,0px));left:0;bottom:0;height:auto;width:min(300px,86vw);z-index:60;transform:translateX(-102%);transition:transform var(--dur-3) var(--ease);box-shadow:var(--shadow-3)}
  body.nav-open .sidenav{transform:none}
  body.nav-open .nav-scrim{display:block}
  .brand .ds{display:none}
}
.nav-scrim{display:none;position:fixed;inset:var(--topbar) 0 0 0;background:var(--scrim);z-index:55}
@media (max-width:640px){
  .search{width:auto;flex:1;min-width:0}
  .search kbd{display:none}
  .tb-btn .lbl{display:none}
  .dd{grid-template-columns:1fr}
  .type-row{grid-template-columns:1fr;gap:4px}
  .brand b{font-size:15px}
  .topbar{gap:8px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* fixes */
.sw .info span{font-family:var(--font)}
.hero{border:1px solid var(--border)}
.en-phone > *{min-width:0}
.sidenav{box-shadow:none}
@media (max-width:960px){body.nav-open .sidenav{box-shadow:var(--shadow-3)}}
nav[aria-label="Pager"]{flex-wrap:wrap}
nav[aria-label="Pager"] .en-btn{white-space:normal;height:auto;min-height:44px;padding-block:8px}
@media (max-width:640px){
  .topbar .spacer{display:none}
  .search{flex:1 1 auto;width:auto}
  .search input{padding-inline-end:8px}
  .hero-stats{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .brand b{display:none}
}
.basis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.ar .eyebrow,[dir=rtl] .eyebrow,[lang=ar]{letter-spacing:0}

.how-item .en-tile,.tenant-scope .en-tile{background:var(--tenant-soft);color:var(--tenant-text)}
.tenant-scope .en-empty .art{background:var(--tenant-soft);color:var(--tenant-text)}
:root[data-theme="dark"] [data-tenant],:root[data-theme="dark"] .tenant-scope{--tenant-soft:color-mix(in srgb,var(--tenant) 22%,#0E1238);--tenant-text:#fff}
.tenant-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tenant-bar button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--fg-2);padding:2px 8px;border-radius:5px}
.tenant-bar button i{width:10px;height:10px;border-radius:50%}
.tenant-bar button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:inset 0 0 0 1px var(--border)}
.tenant-bar button:focus-visible{outline:2px solid var(--focus)}
.mod-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;width:100%}
.mod{border:1px solid var(--border);border-top:3px solid var(--c);border-radius:var(--r-lg);padding:16px;background:var(--surface)}
.mod b{display:block;color:var(--t);font-size:16px;margin-bottom:4px}
.mod span{font-size:13px;color:var(--fg-3)}
.ccard .thumb .en-btn{flex:none}

function mcard(o){o=Object.assign({stamps:0,coins:0,name:'Alaa Test',total:8,max:150,id:''},o);
  let cups='';for(let i=0;i<o.total;i++)cups+=cupSVG(i<o.stamps);
  const pos=v=>(v/o.max*100);
  const note=o.stamps===0?`Your first order puts the first of ${o.total} stamps on the card`:(o.stamps>=o.total?'Card full — your free drink is ready':`${o.total-o.stamps} more for a free drink of any size`);
  return `<div class="mcard" data-mcard="${o.id}" data-stamps="${o.stamps}" data-coins="${o.coins}">
  <div class="top">${tenant(true)}<div class="who"><div class="lbl">Member</div><div class="name">${o.name}</div></div></div>
  <div class="row"><span class="lbl">Stamp card</span><span class="cnt" data-k="s">${o.stamps} / ${o.total}</span></div>
  <div class="cups">${cups}</div>
  <p class="note" data-k="n">${note}</p>
  <div class="row"><span class="lbl">Coins</span><span class="cnt" data-k="c">${o.coins} / ${o.max}</span></div>
  <div class="meter" role="meter" aria-label="Coins toward Black tier" aria-valuemin="0" aria-valuemax="${o.max}" aria-valuenow="${o.coins}">
    <div class="track"></div><div class="fill" style="width:${pos(Math.min(o.coins,o.max))}%"></div>
    ${[[30,'silver','SILVER'],[90,'gold','GOLD'],[150,'black','BLACK']].map(([v,c,l])=>`<i class="knob ${c}${o.coins>=v?' hit':''}" style="left:${pos(v)}%"></i><span class="tl" style="left:${pos(v)}%">${v}<br>${l}</span>`).join('')}
  </div></div>`}
const field=(ph,o={})=>`<div class="en-field">${o.label?`<label for="${o.id}">${o.label}</label>`:''}<div class="en-input${o.cls?' '+o.cls:''}">${o.pre?`<span class="adorn">${o.pre}</span>`:''}<input id="${o.id||''}" placeholder="${ph}" aria-label="${o.aria||ph}" ${o.val?`value="${o.val}"`:''} ${o.dis?'disabled':''} ${o.type?`type="${o.type}"`:''} ${o.err?'aria-invalid="true"':''}>${o.post?`<span class="adorn">${o.post}</span>`:''}</div>${o.help?`<span class="en-help${o.err?' err':''}${o.ok?' ok':''}">${o.err?ic('info','sm'):''}${o.help}</span>`:''}</div>`;

      <div class="dont"><h3>${ic('x-circle','sm')} Avoid</h3><ul><li>“Submit registration form”</li><li>“Tier threshold: 30”</li><li>“Pass provisioning succeeded”</li><li>Exclamation marks in system messages</li></ul></div></div>`},
    {id:'p-rules',t:'Five product rules',d:'Each rule is taken from a decision recorded in the LRP design notes.',stage:'col start',html:`
      <ul class="en-list sep" style="max-width:none">
      <li><span class="en-tile">${ic('sparkle')}</span><div class="tx"><b>The first field goes as high as possible</b><span>No heading above a form when the tenant logo already carries identity.</span></div></li>
      <li><span class="en-tile">${ic('heart')}</span><div class="tx"><b>Nudge, never block</b><span>Reminders are quiet and inline. Nothing is a dead end; prompts degrade to a reminder if dismissed.</span></div></li>
      <li><span class="en-tile">${ic('layers')}</span><div class="tx"><b>The value is the page</b><span>Stamps, coins and tiers are shown in place, not behind a link.</span></div></li>
      <li><span class="en-tile">${ic('globe')}</span><div class="tx"><b>Every screen ships in English and Arabic</b><span>Full mirroring, each language in its own script, Latin brand names bidi-isolated.</span></div></li>
      <li><span class="en-tile">${ic('store')}</span><div class="tx"><b>One page, 100+ brands</b><span>Components take tenant configuration (logo, copy, tiers) and must look right for every tenant.</span></div></li></ul>`}
  ]});

const SW=(name,hex,role,fg)=>`<button class="sw" data-copy="${hex}" aria-label="Copy ${name} ${hex}"><span class="chip" style="background:${hex};color:${fg||'#fff'}">${hex}</span><span class="info"><b>${name}</b><span>${role}</span></span></button>`;

  sections:[
    {id:'c-brand',t:'Brand',d:'Navy is the brand’s ink: headings, body text and the “Book a demo” button. Cyan marks the active or highlighted thing: a selected tab, a featured heading, focus. The logo blues are for the logo only.',stage:'start',html:`<div class="swatches">
      ${SW('Navy','#050A30','primary · text · CTA')}${SW('Navy 900','#08082E','dark panels')}${SW('Slate navy','#213142','dark sections')}${SW('Cyan','#00B3EB','accent · active','#050A30')}${SW('Cyan 700','#00769C','cyan text on white')}${SW('Cyan 50','#E6F7FD','soft fills, selected nav','#00769C')}${SW('Logo blue','#204496','wordmark “ENABLE”')}${SW('Logo mid','#1C60A3','wordmark “Tech”')}${SW('Logo cyan','#00EAE9','logo highlight','#050A30')}</div>`},

    {id:'c-tenant',t:'Tenant themes',d:'Loyalty screens are white-labelled: one page serves 100+ brands, each with its own primary colour. Components on the Loyalty patterns pages read <code>--tenant</code> tokens, and their demos have a tenant switcher in the footer. Dimitri’s Coffee red is the default example.',stage:'start',html:`<div class="swatches">${SW('Dimitri’s · red','#E5322B','example tenant')}${SW('Teal tenant','#0F8B8D','example tenant')}${SW('Plum tenant','#7A2E8E','example tenant')}${SW('ENABLE default','#050A30','when a tenant sets none')}</div>`},

    {id:'c-sem',t:'Semantic',d:'Status colours. Success is the green from enable.tech’s check marks; danger is a darkened coral so it reads on white.',stage:'start',html:`<div class="swatches">${SW('Success','#047857','on #D1FAE5')}${SW('Success 50','#D1FAE5','check backgrounds','#047857')}${SW('Warning','#B45309','attention')}${SW('Info','#2F64D8','neutral notices')}${SW('Danger','#D63F2E','errors, destructive')}</div>`},

      ${[['--bg','#F8FAFC','#06082A','Page ground'],['--surface','#FFFFFF','#0E1238','Cards, inputs, sheets'],['--surface-2','#F1F5F9','#131845','Demo stage, hover'],['--surface-3','#E9EEF5','#1B2152','Pressed, track, skeleton'],['--fg','#050A30','#F1F5F9','Primary text'],['--fg-2','#334155','#CBD5E1','Body copy'],['--fg-3','#64748B','#9AA3C7','Helper text, nav links'],['--placeholder','#94A3B8','#7C86B0','Placeholder only'],['--border','#E2E8F0','#232A5C','Hairlines, inputs'],['--primary','#050A30','#00B3EB','Primary button fill'],['--accent','#00B3EB','#00B3EB','Active tab, focus, highlights'],['--accent-text','#00769C','#38CCFA','Cyan text on surface'],['--tenant','#E5322B','#E5322B','Loyalty screens only']].map(r=>`<tr><td><code>${r[0]}</code></td><td><span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${r[1]};border:1px solid var(--border);vertical-align:-1px"></span> <span class="mono">${r[1]}</span></td><td><span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${r[2]};border:1px solid var(--border);vertical-align:-1px"></span> <span class="mono">${r[2]}</span></td><td>${r[3]}</td></tr>`).join('')}</tbody></table></div>`},

      <tr><td>Navy on Cyan</td><td class="mono">7.9:1</td><td><span class="en-chip sm success">AAA</span></td><td>Cyan fills always carry navy text.</td></tr>
      <tr><td>White on Cyan</td><td class="mono">2.4:1</td><td><span class="en-chip sm danger">Fails</span></td><td>enable.tech uses this on the active solution pill. Use navy text instead.</td></tr>
      <tr><td>Cyan on white (text)</td><td class="mono">2.4:1</td><td><span class="en-chip sm danger">Fails</span></td><td>Cyan headings on white (e.g. “Stay Top of Mind”) only at 28px+ bold; otherwise Cyan 700 (5.2:1).</td></tr>
      <tr><td>Slate 500 on white</td><td class="mono">4.76:1</td><td><span class="en-chip sm success">AA</span></td><td>Nav links and helper text.</td></tr>
      <tr><td>White on Dimitri’s red</td><td class="mono">4.35:1</td><td><span class="en-chip sm warning">AA large</span></td><td>Tenant colours are checked per tenant; bold 16px+ labels only.</td></tr></tbody></table></div>`}
  ]});

P('button','inputs','Button',{refs:R('buttons','button'),
  lede:'Buttons start an action. Each screen gets one navy primary button, as on enable.tech; everything else steps down to accent, outline, soft or ghost. Customer loyalty screens use the tenant button instead.',
  thumb:`<span class="en-btn primary sm">Book a demo</span><span class="en-btn outline sm">AR</span>`,
  sections:[
    {id:'b-var',t:'Variants',d:'<code>primary</code> is the navy CTA (“Book a demo”). <code>accent</code> is the cyan fill with navy text, for a selected or featured action. <code>outline</code>, <code>soft</code> and <code>ghost</code> carry secondary actions.',html:`<button class="en-btn primary">Book a demo</button><button class="en-btn accent">CRM &amp; Data</button><button class="en-btn outline">Show more</button><button class="en-btn soft">Our modules</button><button class="en-btn ghost">Cancel</button><button class="en-btn link">Privacy policy</button>`},
    {id:'b-tenant',t:'Tenant and platform',d:'On white-labelled loyalty screens the main action takes the tenant’s colour. Wallet buttons stay black because Apple and Google require it.',html:`<button class="en-btn tenant">Get my card</button><button class="en-btn tenant" data-tenant="teal">Get my card</button><button class="en-btn tenant" data-tenant="plum">Get my card</button><button class="en-btn wallet">${ic('wallet')} Add to Apple Wallet</button>`},
    {id:'b-size',t:'Sizes',d:'Large (52) for a full-width mobile CTA, medium (44) by default, small (34) inside cards and toolbars.',html:`<button class="en-btn primary sm">Small</button><button class="en-btn primary">Medium</button><button class="en-btn primary lg">Large</button>`},
    {id:'b-icon',t:'With icons',d:'A leading icon describes the action; a trailing chevron or arrow signals movement.',html:`<button class="en-btn primary">${ic('calendar')} Book a demo</button><button class="en-btn accent">${ic('sparkle')} Get started now</button><button class="en-btn outline">Continue ${ic('arrow-right')}</button>`},
    {id:'b-state',t:'States',d:'Loading keeps the label width and announces progress. Disabled drops to 42% opacity; prefer explaining why an action is unavailable.',html:`<button class="en-btn primary" data-act="load">Book a demo</button><button class="en-btn primary" disabled>Disabled</button><button class="en-btn outline" disabled>Disabled</button>`},
    {id:'b-block',t:'Full width',d:'On mobile the primary action spans the column and sits after the terms line.',stage:'col',html:`<div class="phone-w" style="margin:auto;display:flex;flex-direction:column;gap:12px"><p class="en-help" style="text-align:center">By continuing you agree to the <a class="en-link muted" href="#button">terms and conditions</a> of this program.</p><button class="en-btn tenant lg block">Get my card</button></div>`}
  ],

  dos:['Use a verb that names the outcome: “Book a demo”','Keep one primary button per view'],donts:['Put white text on cyan (2.4:1)','Use “Submit”, “OK” or “Click here”'],
  a11y:['Native &lt;button&gt;, so Enter and Space work','Minimum target 44×44px on touch (small buttons get 34px, used only in pointer-dense layouts)','Loading state sets <code>aria-busy="true"</code> and keeps the accessible name']
});

function snack(msg,o={}){let host=$('.en-snack-host');if(!host){host=document.createElement('div');host.className='en-snack-host';host.setAttribute('role','status');document.body.appendChild(host)}
  const el=document.createElement('div');el.className='en-snack'+(o.ok?' ok':'');el.innerHTML=`${o.ok?ic('check-circle','lead'):''}<span>${esc(msg)}</span>${o.undo?'<button>Undo</button>':''}`;host.appendChild(el);

function initTabs(t){const tabs=$$('[role=tab]',t),panels=$$('[role=tabpanel]',t);const sel=i=>{tabs.forEach((b,j)=>{b.setAttribute('aria-selected',i===j);b.tabIndex=i===j?0:-1;panels[j].hidden=i!==j});tabs[i].focus()};

function updateCard(c,st,co){c.dataset.stamps=st;c.dataset.coins=co;const tot=8,max=150;$$('.cups > span',c).forEach((s,i)=>s.className=i<st?'on':'');

  const nv=t.closest('.en-navitem');if(nv){$$('.en-navitem',nv.parentElement).forEach(b=>b.removeAttribute('aria-current'));nv.setAttribute('aria-current','page');const d=nv.closest('[data-drawer]');d&&d.classList.remove('open');return}
  const qb=t.closest('[data-qty] button');if(qb){const q=qb.parentElement,o=$('output',q);let v=+o.textContent+(qb===q.lastElementChild?1:-1);v=Math.max(+q.dataset.min,Math.min(+q.dataset.max,v));o.textContent=v;q.firstElementChild.disabled=v<=+q.dataset.min;q.lastElementChild.disabled=v>=+q.dataset.max;return}

  const th=t.closest('[data-sort] th button');if(th){const tb=th.closest('table'),k=+th.dataset.k,num='n' in th.dataset,body=$('tbody',tb);const dir=th.closest('th').getAttribute('aria-sort')==='ascending'?-1:1;$$('th',tb).forEach(x=>x.removeAttribute('aria-sort'));th.closest('th').setAttribute('aria-sort',dir>0?'ascending':'descending');
